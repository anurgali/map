<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кафе Казани — интерактивная карта</title>
  <style>
    body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    #map { width: 100vw; height: 100vh; }
    .balloon-header { font-weight: bold; font-size: 1.1em; margin-bottom: 4px; }
    .balloon-address { color: #555; font-size: 0.9em; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Подключаем API 3.0 (бесплатно, без ключа для личного использования) -->
  <script src="https://api-maps.yandex.ru/3.0/?lang=ru_RU" type="text/javascript"></script>

  <script>
    // Массив кафе: №, название, адрес, координаты (приблизительные!)
    const cafes = [
      [1, "Ресторанный двор", "ул. Астрономическая, 7", 55.789436, 49.115649],
      [2, "Алан Аш (Туган Авылым)", "ул. Туфана Миннуллина, 14/56", 55.783, 49.118],
      [3, "Хаял", "ул. Университетская, 16", 55.792, 49.125],
      [4, "Урман", "ул. Некрасова, 9", 55.795, 49.140],
      [5, "Плюшка", "ул. Астрономическая, 10", 55.788, 49.116],
      [6, "Чинаяк", "ул. Чернышевского, 29А", 55.780, 49.135],
      [7, "Левел", "ул. Кремлевская, 21", 55.792, 49.130],
      [8, "Татарская кулинария", "ул. Кремлевская, 11", 55.793, 49.128],
      [9, "Алан Аш (Татарская усадьба)", "ул. Ш. Марджани, 8", 55.782, 49.110],
      [10, "АЗУ (Ит парк)", "ул. Петербургская, 52", 55.785, 49.145],
      [11, "АЗУ (отель Европа)", "ул. Петербургская, 14", 55.786, 49.142],
      [12, "АЗУ", "ул. Декабристов, 8", 55.780, 49.138],
      [13, "Медина", "ул. Татарстан, 7", 55.775, 49.120],
      [14, "Медина", "ул. Спартаковская, 12", 55.770, 49.130],
      [15, "Кристалл", "ул. Рустема Яхина, 8", 55.798, 49.115],
      [16, "Русская усадьба", "ул. Бутлерова, 43", 55.805, 49.140],
      [17, "Театральное", "ул. Горького, 13 (театр Тинчурина)", 55.790, 49.133]
    ];

    ymaps.ready(() => {
      const map = new ymaps.Map("map", {
        center: [55.79, 49.13],        // Центр Казани
        zoom: 12,                      // Обзорный зум
        controls: ["zoomControl", "fullscreenControl", "typeSelector"]
      });

      // Создаём единую коллекцию меток (для кластеризации — раскомментируйте ниже)
      const collection = new ymaps.GeoObjectCollection({}, {
        balloonContentLayout: ymaps.templateLayoutFactory.createClass(
          '<div class="balloon-header">{{ properties.name }}</div>' +
          '<div class="balloon-address">{{ properties.address }}</div>'
        ),
        balloonContentBody: "",
        balloonPanelMaxMapArea: 300
      });

      // Добавляем метки
      cafes.forEach(([num, name, address, lat, lon]) => {
        const placemark = new ymaps.Placemark([lat, lon], {
          name: `${num}. ${name}`,
          address: address
        }, {
          iconColor: "#0066cc",
          hideIconOnBalloonOpen: false,
          balloonAutoPan: true
        });

        collection.add(placemark);
      });

      map.geoObjects.add(collection);

      // Опционально: кластеризация (метки группируются при сильном зуме)
      // const clusterer = new ymaps.Clusterer({ clusterDisableClickZoom: true });
      // clusterer.add(cafes.map(([num, name, address, lat, lon]) => 
      //   new ymaps.Placemark([lat, lon], { name, address })
      // ));
      // map.geoObjects.add(clusterer);

      // Подгоняем карту под все метки (раскомментируйте если нужно)
      // map.setBounds(collection.getBounds(), { checkZoomRange: true });
    });
  </script>
</body>
</html>
